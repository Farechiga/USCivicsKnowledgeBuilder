<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>US Civics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2A2D4E;            /* deep blue background */
    --ink-2:#34375E;          /* raised panel */
    --ink-3:#3D406B;          /* higher panel / borders */
    --paper:#FFFFFF;          /* pure white text */
    --slate:#9A9CB0;          /* muted text on blue */
    --slate-solid:#595959;    /* neutral grey block */
    --red:#9F0709;            /* accent, used sparingly */
    --hair:rgba(255,255,255,.12);
    --display:"Fraunces", Georgia, serif;
    --body:"Public Sans", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--body);
    background:#1b1d33;
    color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
  }
  /* phone frame (cosmetic on desktop, full-bleed on mobile) */
  .phone{
    width:100%;max-width:430px;height:100vh;max-height:920px;
    background:var(--ink);
    position:relative;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  @media(min-width:480px){.phone{border-radius:40px;height:880px}}

  /* ---------- top bar ---------- */
  .top{padding:22px 22px 10px;display:flex;flex-direction:column;gap:16px;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{width:38px;height:38px;object-fit:contain;flex:0 0 auto;
               filter:drop-shadow(0 2px 5px rgba(0,0,0,.35))}
  .brand h1{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.2px}
  .brand .sub{margin-left:auto;font-size:12px;color:var(--slate);font-weight:600;letter-spacing:.14em;text-transform:uppercase}

  .modes{display:flex;background:var(--ink-2);border-radius:14px;padding:4px;gap:4px}
  .modes button{
    flex:1;border:0;background:transparent;color:var(--slate);
    font-family:var(--body);font-weight:700;font-size:13.5px;padding:11px 6px;border-radius:11px;
    cursor:pointer;transition:.18s;letter-spacing:.02em;
  }
  .modes button.on{background:var(--paper);color:var(--ink)}
  .modes button .ico{display:block;font-size:17px;margin-bottom:3px}

  .progress{display:flex;gap:10px;align-items:center}
  .progress .track{flex:1;height:5px;border-radius:3px;background:var(--ink-3);overflow:hidden}
  .progress .track .fill{height:100%;background:var(--paper);border-radius:3px;transition:width .25s}
  .progress .count{font-size:11px;font-weight:700;color:var(--slate);letter-spacing:.04em;white-space:nowrap}

  /* ---------- card area ---------- */
  .stage{flex:1 1 auto;overflow-y:auto;padding:6px 22px 22px;-webkit-overflow-scrolling:touch}
  .stage::-webkit-scrollbar{display:none}

  .label{font-size:11.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--slate)}
  .qno{font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--slate)}

  .question{font-family:var(--display);font-weight:600;font-size:29px;line-height:1.22;margin:8px 0 4px}
  .leadin{color:var(--slate);font-size:15px;font-style:italic;margin:10px 0 0}

  .section{margin-top:18px;padding-top:18px;border-top:1px solid var(--hair)}
  .section .label{display:flex;align-items:center;gap:8px}
  .section .label .bar{width:18px;height:2px;background:var(--red);display:inline-block}
  .section p{font-size:18px;line-height:1.5;margin-top:9px}

  /* accepted answers panel */
  .answers{background:var(--ink-2);border:1px solid var(--hair);border-radius:16px;padding:16px 18px;margin-top:10px}
  .answers .a{font-size:20px;font-weight:700;padding:7px 0;display:flex;gap:10px;align-items:baseline}
  .answers .a:not(:last-child){border-bottom:1px solid var(--hair)}
  .answers .a .tick{color:var(--red);font-weight:800}

  .note{background:rgba(89,89,89,.28);border-left:3px solid var(--slate-solid);border-radius:8px;
        padding:11px 14px;font-size:14.5px;color:#D8D9E4;margin-top:12px;line-height:1.45}

  .fun{background:linear-gradient(180deg, rgba(159,7,9,.16), rgba(159,7,9,.06));
       border:1px solid rgba(159,7,9,.4);border-radius:16px;padding:16px 18px;margin-top:10px}
  .fun .label{color:#F1B3B4}
  .fun .star{color:var(--red)}
  .fun p{font-size:18px;line-height:1.5;margin-top:9px}
  .src{font-size:11px;color:var(--slate);margin-top:10px;letter-spacing:.02em}

  /* clickable sections (Quiz mode audio) */
  .clickable{cursor:pointer}
  .clickable:active{opacity:.65}
  .play-ico{
    display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;background:rgba(159,7,9,.18);color:var(--red);
    border-radius:50%;font-size:9px;padding-left:1px;
    margin-left:8px;vertical-align:middle;flex-shrink:0;
  }
  .a.clickable .play-ico{margin-left:auto}
  .a.clickable{padding-right:0}

  /* vocabulary chips */
  .vocab{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
  .chip{background:var(--ink-2);border:1px solid var(--hair);border-radius:999px;
        padding:8px 13px;font-weight:600;font-size:14.5px;cursor:pointer;display:flex;align-items:center;gap:7px}
  .chip .hot{width:6px;height:6px;border-radius:50%;background:var(--red)}
  .defn{background:var(--ink-2);border:1px solid var(--hair);border-radius:14px;padding:14px 16px;margin-top:10px;display:none}
  .defn.open{display:block}
  .defn .word{font-family:var(--display);font-size:21px;font-weight:600}
  .defn .pron{color:var(--red);font-weight:700;font-size:14px;letter-spacing:.04em;margin-top:2px}
  .defn .kid{font-size:16.5px;line-height:1.5;margin-top:9px;color:#E6E7EF}
  .defn .orig{font-size:15px;line-height:1.45;margin-top:9px;color:#CFD0DC;font-style:italic}
  .defn .say{margin-top:11px;background:transparent;border:1px solid var(--hair);color:var(--paper);
             border-radius:10px;padding:8px 12px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:var(--body)}

  .mnemonic{margin-top:12px;background:var(--ink-2);border:1px dashed var(--hair);border-radius:14px;padding:14px 16px}
  .mnemonic .label{color:var(--slate)}
  .mnemonic p{font-size:16px;line-height:1.5;margin-top:8px}
  .mnemonic .tag{font-size:10.5px;color:var(--slate);text-transform:uppercase;letter-spacing:.14em;margin-top:8px}

  /* ---------- controls ---------- */
  .controls{flex:0 0 auto;padding:14px 22px calc(20px + env(safe-area-inset-bottom));background:var(--ink);
            border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:11px}
  .btn{border:0;border-radius:16px;padding:18px;font-family:var(--body);font-weight:800;font-size:18px;cursor:pointer;width:100%}
  .btn-primary{background:var(--paper);color:var(--ink)}
  .btn-ghost{background:transparent;color:var(--paper);border:1.5px solid var(--hair)}
  .btn-red{background:var(--red);color:var(--paper)}
  .row{display:flex;gap:11px}
  .row .btn{flex:1}

  /* drive mode */
  .drive{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:14px}
  .drive .step{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--red);min-height:16px}
  .drive .big{font-family:var(--display);font-weight:600;font-size:27px;line-height:1.28;margin-top:16px}
  .drive .drivelead{font-family:var(--body);font-style:italic;font-weight:500;font-size:17px;color:var(--slate);margin-bottom:16px;line-height:1.4}
  .drive .drivelist{list-style:none;text-align:left;display:inline-block;margin-top:6px}
  .drive .drivelist li{font-family:var(--display);font-weight:600;font-size:25px;line-height:1.32;padding:7px 0 7px 28px;position:relative}
  .drive .drivelist li:before{content:"";position:absolute;left:0;top:16px;width:11px;height:11px;border-radius:50%;background:var(--red)}
  .drive .vcard{margin-top:8px;text-align:center}
  .drive .vword{font-family:var(--display);font-weight:700;font-size:31px}
  .drive .vpron{color:var(--red);font-weight:700;font-size:15px;letter-spacing:.05em;margin-top:5px}
  .drive .vorigin{font-size:18px;line-height:1.45;margin-top:15px;color:#E6E7EF}
  .drive .vdef{font-size:18px;line-height:1.45;margin-top:10px;color:var(--paper)}
  .wave{display:flex;gap:5px;align-items:flex-end;height:34px;margin-top:26px}
  .wave i{width:5px;background:var(--paper);border-radius:3px;height:8px;opacity:.5}
  .wave.live i{animation:bounce .9s ease-in-out infinite}
  .wave.live i:nth-child(2){animation-delay:.1s}.wave.live i:nth-child(3){animation-delay:.2s}
  .wave.live i:nth-child(4){animation-delay:.3s}.wave.live i:nth-child(5){animation-delay:.15s}
  @keyframes bounce{0%,100%{height:8px;opacity:.4}50%{height:30px;opacity:1}}
  .circle{width:78px;height:78px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);
          font-size:30px;cursor:pointer;display:grid;place-items:center}
  .drivebar{display:flex;align-items:center;justify-content:center;gap:26px}
  .drivebar .mini{background:transparent;border:0;color:var(--paper);cursor:pointer;
                  padding:6px;display:flex;align-items:center;justify-content:center;
                  transition:opacity .15s}
  .drivebar .mini:active{opacity:.5}
  .drivebar .mini svg{display:block;width:28px;height:28px}

  .srs{font-size:11.5px;color:var(--slate);text-align:center;padding-top:4px}
  .hide{display:none}
</style>
</head>
<body>
<div class="phone">
  <div class="top">
    <div class="brand">
      <img class="logo" src="../assets/America250_logo.png" alt="America 250 mascot" width="38" height="38">
      <h1>American Civics 250th Edition</h1>
      <span class="sub" id="modeName">Drive</span>
    </div>
    <div class="modes">
      <button id="m-drive" class="on" onclick="setMode('drive')">Drive</button>
      <button id="m-quiz" onclick="setMode('quiz')">Quiz</button>
      <button id="m-study" onclick="setMode('study')">Study</button>
    </div>
    <div class="progress" id="pips"></div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="controls" id="controls"></div>
</div>

<!-- All 125 questions + terms, generated from data/ by scripts/build-app-data.js -->
<script src="data.js"></script>
<script>
/* ============================================================
   DATA — TERMS and Q come from data.js (the full 125-question set).
   Shuffle the deck once at load so questions appear in random order.
============================================================ */
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
shuffle(Q);

/* ---------------- state ---------------- */
let mode='drive', idx=0, revealed=false, openTerm=null, currentClip=null;
const stage=document.getElementById('stage'), controls=document.getElementById('controls');
const qid = n => 'q' + String(n).padStart(3,'0');
const attrEsc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* Single reusable Audio element: iOS Safari only treats an element as
   "unlocked" after a user gesture, so we reuse one across all clips. */
const audioEl = new Audio();
audioEl.preload = 'auto';
/* Delegated click handler: data-clip-seq plays a JSON sequence of clips
   (mirrors Drive's multi-file step); data-clip plays a single file.
   Both use the element's data-fallback text as TTS fallback. */
stage.addEventListener('click', e=>{
  const seqEl = e.target.closest('[data-clip-seq]');
  if(seqEl){
    try{ playSequence(JSON.parse(seqEl.dataset.clipSeq)); }catch(err){}
    return;
  }
  const el = e.target.closest('[data-clip]');
  if(el) playClip(el.dataset.clip, el.dataset.fallback||'');
});
function playSequence(items){
  if(!items||!items.length) return;
  let i=0;
  const playNext=()=>{
    if(i>=items.length) return;
    const c=items[i++];
    playClip(c.file, c.text, {slow:!!c.slow}, playNext);
  };
  playNext();
}

function setMode(m){ stopAudio(); mode=m; revealed=false; openTerm=null;
  document.querySelectorAll('.modes button').forEach(b=>b.classList.remove('on'));
  document.getElementById('m-'+m).classList.add('on');
  document.getElementById('modeName').textContent={drive:'Drive',quiz:'Quiz',study:'Study'}[m];
  render();
}
function pips(){
  const pct = Q.length ? Math.round(((idx+1)/Q.length)*100) : 0;
  return `<div class="progress"><div class="track"><div class="fill" style="width:${pct}%"></div></div><span class="count">${idx+1} / ${Q.length}</span></div>`;
}
document.getElementById('pips').outerHTML=pips();
function refreshPips(){ document.querySelector('.progress').outerHTML=pips(); }

function next(){ if(idx<Q.length-1){idx++} else {idx=0} revealed=false;openTerm=null;stopAudio();render(); }
function prev(){ if(idx>0){idx--} revealed=false;openTerm=null;stopAudio();render(); }

/* sections shared by quiz/study reveal */
function answerPanel(d){
  return `<div class="answers">${d.ans.map(a=>`<div class="a"><span class="tick">✓</span><span>${a}</span></div>`).join('')}</div>`;
}
function whyBlock(d){
  return `<div class="section"><span class="label"><span class="bar"></span>Why this matters</span><p>${d.why}</p></div>`;
}
function funBlock(d){
  return `<div class="fun"><span class="label"><span class="star">★</span> Fun fact</span><p>${d.fun}</p><div class="src">Source: ${d.src}</div></div>`;
}
function vocabBlock(d){
  if(!d.terms||!d.terms.length) return '';
  const chips=d.terms.map(t=>{const e=TERMS[t];return `<span class="chip" onclick="toggleTerm('${t}')">${e.hard?'<span class="hot"></span>':''}${e.term}</span>`}).join('');
  let def='';
  if(openTerm){const e=TERMS[openTerm];
    def=`<div class="defn open"><div class="word">${e.term}</div><div class="pron">${e.pron}</div>${e.origin?`<div class="orig">${e.origin}</div>`:''}<div class="kid">${e.kid}</div><button class="say" onclick="playClip('term_${openTerm}_word','${e.term.replace(/'/g,"\\'")}',{slow:true})">🔊 Hear it slowly</button></div>`;}
  return `<div class="section"><span class="label"><span class="bar"></span>Vocabulary</span><div class="vocab">${chips}</div>${def}</div>`;
}
function mnemBlock(d){
  if(!d.mnem) return '';
  return `<div class="mnemonic"><span class="label">Memory hook</span><p>${d.mnem.link}</p><div class="tag">★ Memory device — not a fact</div></div>`;
}
function toggleTerm(t){ openTerm = (openTerm===t?null:t); render(); }

/* ============================================================
   RENDER per mode
============================================================ */
function render(){
  refreshPips();
  const d=Q[idx];
  if(mode==='drive') return renderDrive(d);
  if(mode==='quiz')  return renderQuiz(d);
  return renderStudy(d);
}

/* -------- QUIZ (mommy–daughter): examiner sees answers -------- */
function renderQuiz(d){
  const q=qid(d.id);
  const ico='<span class="play-ico" aria-hidden="true">▶</span>';
  const ansRows=d.ans.map(a=>
    `<div class="a"><span class="tick">✓</span><span>${a}</span></div>`
  ).join('');
  const ansSeq=attrEsc(JSON.stringify(d.ans.map((a,i)=>({file:`${q}_answer_${i+1}`, text:a}))));
  stage.innerHTML = `
    <div class="qno">Question ${d.id} &nbsp;·&nbsp; for the quiz-master 👧</div>
    <div class="question clickable" data-clip="${q}_question" data-fallback="${attrEsc(d.q)}">${d.q}${ico}</div>
    ${d.lead?`<div class="leadin clickable" data-clip="${q}_lead_in" data-fallback="${attrEsc(d.lead)}">${d.lead}${ico}</div>`:''}
    <div class="section clickable" data-clip-seq="${ansSeq}"><span class="label"><span class="bar"></span>Accepted answers — did Mom say one?${ico}</span><div class="answers">${ansRows}</div></div>
    <div class="section clickable" data-clip="${q}_why" data-fallback="${attrEsc(d.why)}"><span class="label"><span class="bar"></span>Why this matters${ico}</span><p>${d.why}</p></div>
    <div class="fun clickable" data-clip="${q}_fun" data-fallback="${attrEsc(d.fun)}"><span class="label"><span class="star">★</span> Fun fact${ico}</span><p>${d.fun}</p><div class="src">Source: ${d.src}</div></div>
  `;
  controls.innerHTML = `<button class="btn btn-primary" onclick="next()">Next question ▶</button>`;
}
function reveal(){ revealed=true; render(); }

/* -------- STUDY (solo): guess first, then full detail + SRS -------- */
function renderStudy(d){
  if(!revealed){
    stage.innerHTML = `
      <div class="qno">Question ${d.id} of ${Q.length}</div>
      <div class="question">${d.q}</div>
      ${d.lead?`<div class="leadin">${d.lead}</div>`:''}
      <div class="note">Say your answer out loud first — then check yourself.</div>`;
    controls.innerHTML = `<button class="btn btn-primary" onclick="reveal()">Reveal answer</button>`;
    return;
  }
  stage.innerHTML = `
    <div class="qno">Question ${d.id} of ${Q.length}</div>
    <div class="question">${d.q}</div>
    <div class="section"><span class="label"><span class="bar"></span>Official answer${d.ans.length>1?'s':''}</span>${answerPanel(d)}
      ${d.dis?`<div class="note">${d.dis}</div>`:''}</div>
    ${whyBlock(d)}
    ${funBlock(d)}
    ${vocabBlock(d)}
    ${mnemBlock(d)}`;
  controls.innerHTML = `
    <div class="srs">How well did you recall it?</div>
    <div class="row">
      <button class="btn btn-red" onclick="rate('again')">Again</button>
      <button class="btn btn-ghost" onclick="rate('good')">Good</button>
      <button class="btn btn-primary" onclick="rate('easy')">Easy</button>
    </div>`;
}
function rate(r){ /* mock SRS: easy=long gap, again=soon */ next(); }

/* -------- DRIVE (hands-free): audio sequence via TTS -------- */
let driveSteps=[], driveAt=0, playing=false;
function buildSteps(d){
  const many=d.ans.length>1;
  const q=qid(d.id);
  const leadHTML = d.lead ? `<div class="drivelead">${d.lead}</div>` : '';
  const ansListHTML = many
    ? '<ul class="drivelist">'+d.ans.map(x=>'<li>'+x+'</li>').join('')+'</ul>'
    : d.ans[0];
  const answerHTML = leadHTML + ansListHTML;
  const answerSay = many ? ("You can say any one of these. "+d.ans.join(". ")) : ("The answer is. "+d.ans[0]);
  const baseAnswerFiles = d.ans.map((a,i)=>({file:`${q}_answer_${i+1}`, text:a}));
  const answerFiles = d.lead
    ? [{file:`${q}_lead_in`, text:d.lead}, ...baseAnswerFiles]
    : baseAnswerFiles;
  const vocab=(d.terms||[]).filter(t=>TERMS[t]&&TERMS[t].origin).map(t=>{
    const e=TERMS[t];
    return {tag:"Word to know",
      text:`<div class="vcard"><div class="vword">${e.term}</div><div class="vpron">${e.pron}</div><div class="vorigin">${e.origin}</div><div class="vdef">${e.kid}</div></div>`,
      say:`Word to know. ${e.term}. ${e.origin} ${e.kid} Let's say it slowly.`,
      files:[
        {file:`term_${t}_origin`, text:e.origin},
        {file:`term_${t}_def`,    text:e.kid},
        {file:`term_${t}_word`,   text:e.term, slow:true},
        {file:`term_${t}_word`,   text:e.term, slow:true}
      ]};
  });
  const steps = [
    {tag:"Question", text:d.q, say:d.q, file:`${q}_question`},
    {tag:"Your turn", text:"Say it out loud…", say:"", pause:3500},
    {tag:"Answer", text:answerHTML, say:answerSay, files:answerFiles}
  ];
  if(d.dis) steps.push({tag:"Good to know", text:d.dis, say:"Good to know. "+d.dis, file:`${q}_disambiguation`});
  steps.push(...vocab);
  steps.push({tag:"Why this matters", text:d.why, say:"Why this matters. "+d.why, file:`${q}_why`});
  steps.push({tag:"Fun fact", text:d.fun, say:"Fun fact. "+d.fun, file:`${q}_fun`});
  if(d.mnem) steps.push({tag:"Remember it", text:d.mnem.link, say:"Remember it. "+d.mnem.link, file:`${q}_mnemonic`});
  return steps;
}
function renderDrive(d){
  driveSteps=buildSteps(d); driveAt=0;
  paintDrive();
  controls.innerHTML = `
    <div class="drivebar">
      <button class="mini" onclick="prev()" aria-label="Previous"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6z M20 5v14L9 12z"/></svg></button>
      <button class="circle" id="play" onclick="togglePlay()">▶</button>
      <button class="mini" onclick="next()" aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2z M4 5v14L15 12z"/></svg></button>
    </div>
    <div class="srs">Hands-free: tap once to play. It reads the question, waits, then reveals.</div>`;
}
function paintDrive(){
  const s=driveSteps[driveAt];
  stage.innerHTML = `
    <div class="drive">
      <div class="step">${s.tag}</div>
      <div class="big">${s.text}</div>
      <div class="wave ${playing?'live':''}"><i></i><i></i><i></i><i></i><i></i></div>
    </div>`;
}
function togglePlay(){ playing?stopAudio():playSeq(); }
function playSeq(){
  playing=true; document.getElementById('play').textContent='⏸'; paintDrive();
  runStep();
}
function runStep(){
  if(!playing) return;
  if(driveAt>=driveSteps.length){ playing=false; document.getElementById('play').textContent='▶'; next(); setTimeout(()=>{if(mode==='drive')playSeq()},700); return; }
  const s=driveSteps[driveAt]; paintDrive();
  const advance=()=>{ driveAt++; runStep(); };
  if(s.files && s.files.length){
    let i=0;
    const playNext=()=>{
      if(!playing) return;
      if(i>=s.files.length){ advance(); return; }
      const c=s.files[i];
      playClip(c.file, c.text, {slow:!!c.slow}, ()=>{ i++; playNext(); });
    };
    playNext();
  } else if(s.file){
    playClip(s.file, s.say, {}, advance);
  } else if(s.say){
    say(s.say, false, advance);
  } else {
    setTimeout(advance, s.pause||2000);
  }
}
function stopAudio(){
  playing=false;
  try{speechSynthesis.cancel()}catch(e){}
  if(currentClip){ try{currentClip.pause()}catch(e){} currentClip=null; }
  const p=document.getElementById('play'); if(p)p.textContent='▶';
  const w=document.querySelector('.wave'); if(w)w.classList.remove('live');
}

/* Recorded-clip helper: tries mp3, falls back to TTS per fragment.
   Reuses the single audioEl so iOS keeps it unlocked across clips. */
function playClip(fileBase, fallbackText, opts, onEnd){
  const slow = opts && opts.slow;
  let done=false; const finish=()=>{ if(!done){done=true; onEnd&&onEnd();} };
  const a=audioEl;
  try{ a.pause(); }catch(e){}
  a.onended=finish;
  a.onerror=()=>say(fallbackText, slow, finish);
  a.src='../audio/'+fileBase+'.mp3';
  a.play().catch(()=>say(fallbackText, slow, finish));
  currentClip=a;
  return a;
}

/* TTS helper */
function say(text, slow, done){
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.rate = slow?0.7:0.96; u.pitch=1; u.lang='en-US';
    if(done) u.onend=done;
    speechSynthesis.speak(u);
  }catch(e){ if(done) setTimeout(done,1200); }
}

setMode('drive');
</script>
